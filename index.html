<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Personalize: replace "Your Name", the description, and every

      (or your custom domain). Social sites need these URLs to be absolute.
    -->
    <title>Your Name | Portfolio</title>
    <meta name="description" content="A one-sentence description of who you are and what you do. Shown in search results." />
    <meta name="theme-color" content="#eee5d3" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Your Name" />
    <meta property="og:url" content="https://YOUR-USERNAME.github.io/YOUR-REPO/" />
    <meta property="og:title" content="Your Name | Portfolio" />
    <meta property="og:description" content="A one-sentence description of who you are and what you do. Shown in search results." />
    <meta property="og:image" content="https://YOUR-USERNAME.github.io/YOUR-REPO/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Your Name portfolio" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Your Name | Portfolio" />
    <meta name="twitter:description" content="A one-sentence description of who you are and what you do. Shown in search results." />
    <meta name="twitter:image" content="https://YOUR-USERNAME.github.io/YOUR-REPO/images/og-image.jpg" />
